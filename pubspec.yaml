name: vital_bluetooth
description: "Bluetooth LE for wearables and healthcare devices that stays connected in the background: native reconnects, restored notifications, queued GATT and typed errors."
version: 0.1.0
repository: https://github.com/AnChiyoung/vital_bluetooth
issue_tracker: https://github.com/AnChiyoung/vital_bluetooth/issues
topics:
  - bluetooth
  - ble
  - bluetooth-low-energy
  - wearables
  - healthcare

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  pigeon: ^29.1.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.goodluckcy.vital_bluetooth
        pluginClass: VitalBluetoothPlugin
      ios:
        pluginClass: VitalBluetoothPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: VitalBluetoothPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: VitalBluetoothPluginCApi
